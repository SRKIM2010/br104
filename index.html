<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예성스타즈 | Yesung Stars</title>
    <!-- Google Fonts: Outfit & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-glows">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container">
        
        <!-- LOBBY SCREEN -->
        <div id="lobby-screen" class="active-screen">
            <header class="lobby-header">
                <div class="title-logo">
                    <span class="neon-purple">YESUNG</span><span class="neon-amber">STARS</span>
                </div>
                <div class="subtitle">실시간 멀티플레이어 예성고 난투전</div>
            </header>

            <main class="lobby-content">
                <!-- User Configuration Form -->
                <section class="config-panel glassmorphism">
                    <div class="input-group">
                        <label for="player-name"><i class="fa-solid fa-user"></i> 플레이어 닉네임</label>
                        <input type="text" id="player-name" placeholder="닉네임을 입력하세요" maxlength="8" value="선덕고학생">
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group">
                            <label for="room-code"><i class="fa-solid fa-key"></i> 방 코드 (영어/숫자)</label>
                            <input type="text" id="room-code" placeholder="LOBBY1" maxlength="6" value="ROOM1">
                        </div>
                        <div class="input-group">
                            <label for="server-ip"><i class="fa-solid fa-server"></i> 서버 IP 주소</label>
                            <input type="text" id="server-ip" placeholder="localhost:8080" value="localhost:8080">
                        </div>
                    </div>
                </section>

                <!-- Brawler Selector Grid -->
                <section class="brawler-selector-container">
                    <h3 class="section-title"><i class="fa-solid fa-gamepad"></i> 브롤러 선택</h3>
                    <div class="brawler-grid" id="brawler-grid">
                        <!-- Cards generated by JS -->
                    </div>
                </section>

                <!-- Action Button -->
                <footer class="lobby-actions">
                    <button id="btn-join" class="lobby-play-btn neon-btn">
                        <span class="btn-text">게임 입장하기</span>
                        <i class="fa-solid fa-circle-play"></i>
                    </button>
                </footer>
            </main>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="inactive-screen">
            <!-- HUD Top Panel -->
            <header class="hud-top">
                <div class="hud-left">
                    <button id="btn-leave" class="hud-back-btn" title="대기실로 돌아가기">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="room-indicator">
                        방: <span id="hud-room-code">ROOM1</span>
                    </div>
                </div>
                
                <div class="hud-center">
                    <div class="match-timer-box">
                        <i class="fa-regular fa-clock"></i>
                        <span id="match-timer">02:00</span>
                    </div>
                </div>

                <div class="hud-right">
                    <div class="stats-item cubes-stat">
                        <i class="fa-solid fa-gem cube-color"></i>
                        <span id="hud-cubes">0</span>
                    </div>
                    <div class="stats-item kills-stat">
                        <i class="fa-solid fa-skull kill-color"></i>
                        <span id="hud-kills">0</span>
                    </div>
                </div>
            </header>

            <!-- Main Interactive Canvas -->
            <div id="canvas-container">
                <canvas id="game-canvas"></canvas>
            </div>

            <!-- HUD Bottom Panel (Controls Overlay) -->
            <div class="hud-bottom">
                <div class="controls-overlay">
                    <!-- Ammo Bars -->
                    <div class="ammo-container" id="ammo-container">
                        <div class="ammo-bar active-ammo"></div>
                        <div class="ammo-bar active-ammo"></div>
                        <div class="ammo-bar active-ammo"></div>
                    </div>
                    
                    <!-- Player Health (large bar) -->
                    <div class="player-hp-bar-container">
                        <div class="player-hp-bar" id="player-hp-fill" style="width: 100%"></div>
                        <span class="player-hp-text" id="player-hp-text">4000 / 4000</span>
                    </div>

                    <!-- Super/Ult Button (Glowing yellow) -->
                    <button id="btn-super" class="super-btn disabled-super" disabled>
                        <div class="super-inner">
                            <i class="fa-solid fa-bolt"></i>
                            <span class="super-percent" id="super-percent">0%</span>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Kill announcement banner -->
            <div class="kill-feed" id="kill-feed">
                <!-- Kill notifications appended dynamically -->
            </div>

            <!-- System chat panel -->
            <div class="system-chat" id="system-chat"></div>
        </div>

    </div>

    <!-- GAME OVER / LEADERBOARD MODAL -->
    <div id="game-over-modal" class="modal-overlay hidden">
        <div class="modal-content glassmorphism">
            <div class="modal-header">
                <i class="fa-solid fa-trophy trophy-glow"></i>
                <h2 class="modal-title">매치 결과</h2>
            </div>
            
            <div class="modal-body">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>순위</th>
                            <th>플레이어 (브롤러)</th>
                            <th>처치 수</th>
                            <th>파워 큐브</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Score rows appended dynamically -->
                    </tbody>
                </table>
            </div>

            <div class="modal-footer">
                <button id="btn-modal-back" class="modal-btn back-lobby">대기실로</button>
                <button id="btn-modal-restart" class="modal-btn play-again">다시 시작</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="modal-overlay hidden">
        <div class="spinner-container">
            <div class="spinner"></div>
            <p class="loading-text">서버에 연결하는 중...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="game.js"></script>
</body>
</html>
